name: CI

# Ports docs/archive/autoresearch/verify.sh (pytest + vitest + tsc --noEmit) and
# docs/archive/autoresearch/guard.sh (typecheck gate) into Actions, and adds a Postgres job
# the local scripts could not run: migrations/009's hash-chain SQL is only
# meaningfully tested against a real server.
#
# The e2e job runs Playwright against the full `docker compose up` stack with
# no keys at all: the chat is answered by the offline agent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict; app/ clean, baseline for old tests/scripts)
        run: python -m scripts.mypy_baseline

      - name: pytest
        run: pytest -q

  backend-postgres:
    name: backend · ledger against real Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # pgvector, because 001_initial_schema.sql creates the `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: egata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d egata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/egata
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/egata
      # bootstrap gives egata_app this password; the API and offline-agent
      # suites then run the backend as that least-privilege role.
      APP_DB_PASSWORD: ci-app-password
      APP_DATABASE_URL: postgresql://egata_app:ci-app-password@localhost:5432/egata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Apply migrations + seed
        run: python -m scripts.bootstrap_local_db

      - name: Ledger, document API and offline-agent integration tests
        run: pytest -q tests/test_ledger_postgres.py tests/test_api_postgres.py tests/test_offline_agent_postgres.py tests/test_distributed_locks_postgres.py

  frontend:
    name: frontend · vitest + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: vitest
        run: npm run test

  pdf:
    name: templates render with real pdflatex
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-european lmodern

      - name: Install
        run: pip install -e ".[dev]"

      - name: Render every procedure's template
        env:
          RUN_PDF_TESTS: "1"
        run: pytest -q tests/test_template_rendering.py

  e2e:
    name: e2e · compose stack (no keys) + Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack exactly as a stranger would
        run: docker compose up -d --build

      - name: Wait for backend and frontend
        run: |
          curl --retry 60 --retry-delay 5 --retry-all-errors -fsS http://localhost:8000/health
          curl --retry 60 --retry-delay 5 --retry-all-errors -fsS -o /dev/null http://localhost:3000

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          API_BASE: http://127.0.0.1:8000
          # flow.spec.ts saves one picture per step of the headline flow.
          E2E_SCREENSHOTS_DIR: e2e-screenshots
        run: npx playwright test

      - name: Screenshots of the flow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/e2e-screenshots/
          if-no-files-found: ignore

      - name: Traces and videos of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color | tail -300
