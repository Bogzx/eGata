name: CI

# Ports autoresearch/verify.sh (pytest + vitest + tsc --noEmit) and
# autoresearch/guard.sh (typecheck gate) into Actions, and adds a Postgres job
# the local scripts could not run: migrations/009's hash-chain SQL is only
# meaningfully tested against a real server.
#
# Playwright is deliberately absent — frontend/e2e/ drives a live Azure-backed
# backend, so it cannot run here without a paid key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  backend-postgres:
    name: backend · ledger against real Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # pgvector, because 001_initial_schema.sql creates the `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: egata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d egata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/egata
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/egata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Apply migrations + seed
        run: python -m scripts.bootstrap_local_db

      - name: Ledger + document API integration tests
        run: pytest -q tests/test_ledger_postgres.py tests/test_api_postgres.py

  frontend:
    name: frontend · vitest + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: vitest
        run: npm run test

  pdf:
    name: templates render with real pdflatex
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-european lmodern

      - name: Install
        run: pip install -e ".[dev]"

      - name: Render every procedure's template
        env:
          RUN_PDF_TESTS: "1"
        run: pytest -q tests/test_template_rendering.py
